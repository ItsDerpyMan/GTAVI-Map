<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Vice City Sunset Sky Gradient -->
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F" />
      <stop offset="22%" stop-color="#5D549C" />
      <stop offset="52%" stop-color="#7E3A63" />
      <stop offset="78%" stop-color="#A373D3" />
      <stop offset="100%" stop-color="#EB9998" />
    </linearGradient>

    <!-- Neon Pink / Purple Accent Gradient -->
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="50%" stop-color="#EB9998" />
      <stop offset="100%" stop-color="#A373D3" />
    </linearGradient>

    <!-- 3D Building Extrusion Gradients -->
    <linearGradient id="bldgFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5D549C" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="bldgSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A373D3" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F0F0F" stop-opacity="0.5" />
    </linearGradient>

    <!-- Dark Glass Panel Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#181424" stop-opacity="0.74" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#EB9998" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0F0F0F" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sunset -->
  <rect width="1200" height="420" rx="18" fill="url(#sunsetSky)" />
  <rect width="1200" height="420" rx="18" fill="url(#sunGlow)" />

  <!-- Glowing Retro Sun Disc -->
  <circle cx="930" cy="270" r="130" fill="#EB9998" opacity="0.28" filter="url(#neonGlow)" />
  <circle cx="930" cy="270" r="95" fill="#FF2D55" opacity="0.22" />

  <!-- Perspective 3D Map Grid at the bottom/right -->
  <g opacity="0.45" stroke="#FF2D55" stroke-width="1.2">
    <!-- Horizontal perspective lines -->
    <line x1="0" y1="310" x2="1200" y2="310" stroke="#A373D3" stroke-opacity="0.4" />
    <line x1="0" y1="332" x2="1200" y2="332" stroke="#A373D3" stroke-opacity="0.5" />
    <line x1="0" y1="358" x2="1200" y2="358" stroke="#FF2D55" stroke-opacity="0.6" />
    <line x1="0" y1="388" x2="1200" y2="388" stroke="#FF2D55" stroke-opacity="0.75" />
    <!-- Diagonal perspective grid lines -->
    <line x1="600" y1="280" x2="100" y2="420" />
    <line x1="650" y1="280" x2="320" y2="420" />
    <line x1="700" y1="280" x2="540" y2="420" />
    <line x1="750" y1="280" x2="760" y2="420" />
    <line x1="800" y1="280" x2="980" y2="420" />
    <line x1="850" y1="280" x2="1180" y2="420" />
  </g>

  <!-- Stylized 3D Extruded Vice City Skyline (Right Side Showcase) -->
  <g transform="translate(760, 85)">
    <!-- glowing neon road path on the map -->
    <path d="M -40 270 Q 90 230 220 265 T 410 230" fill="none" stroke="#FF2D55" stroke-width="4" filter="url(#neonGlow)" />
    <path d="M 30 295 Q 150 250 340 280" fill="none" stroke="#EB9998" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Extruded 3D Building 1 (Tall Tower) -->
    <polygon points="110,70 150,55 150,235 110,250" fill="url(#bldgFront)" stroke="#FF2D55" stroke-width="1.2" />
    <polygon points="150,55 185,70 185,250 150,235" fill="url(#bldgSide)" stroke="#A373D3" stroke-width="1.2" />
    <polygon points="110,70 150,55 185,70 145,85" fill="#FF2D55" fill-opacity="0.9" />

    <!-- Extruded 3D Building 2 (Mid Hotel) -->
    <polygon points="40,135 75,122 75,255 40,268" fill="url(#bldgFront)" stroke="#EB9998" stroke-width="1.2" />
    <polygon points="75,122 105,135 105,268 75,255" fill="url(#bldgSide)" stroke="#A373D3" stroke-width="1.2" />
    <polygon points="40,135 75,122 105,135 70,148" fill="#EB9998" fill-opacity="0.85" />

    <!-- Extruded 3D Building 3 (Vice Beach Block) -->
    <polygon points="195,115 235,100 235,245 195,260" fill="url(#bldgFront)" stroke="#FF2D55" stroke-width="1.2" />
    <polygon points="235,100 270,115 270,260 235,245" fill="url(#bldgSide)" stroke="#5D549C" stroke-width="1.2" />
    <polygon points="195,115 235,100 270,115 230,130" fill="#A373D3" fill-opacity="0.9" />

    <!-- Extruded 3D Building 4 (Low Block) -->
    <polygon points="280,165 315,152 315,255 280,268" fill="url(#bldgFront)" stroke="#EB9998" stroke-width="1" />
    <polygon points="315,152 345,165 345,268 315,255" fill="url(#bldgSide)" stroke="#6F70A2" stroke-width="1" />
    <polygon points="280,165 315,152 345,165 310,178" fill="#FF2D55" fill-opacity="0.8" />

    <!-- Map Marker Blips floating above 3D buildings -->
    <g filter="url(#neonGlow)">
      <circle cx="148" cy="32" r="11" fill="#FF2D55" stroke="#FFFFFF" stroke-width="2" />
      <path d="M144 32 L152 32 M148 28 L148 36" stroke="#FFFFFF" stroke-width="2" />
      <line x1="148" y1="43" x2="148" y2="62" stroke="#FF2D55" stroke-width="1.5" stroke-dasharray="3 2" />

      <circle cx="232" cy="76" r="9" fill="#5D549C" stroke="#EB9998" stroke-width="2" />
      <line x1="232" y1="85" x2="232" y2="105" stroke="#EB9998" stroke-width="1.5" stroke-dasharray="3 2" />
    </g>
  </g>

  <!-- Palm Tree Silhouette Left -->
  <g fill="#0F0F0F" opacity="0.65">
    <path d="M 55 420 Q 75 270 115 160 L 127 162 Q 92 275 80 420 Z" />
    <path d="M 120 162 Q 45 130 5 165 Q 60 155 118 172 Z" />
    <path d="M 122 160 Q 55 95 10 105 Q 68 118 120 165 Z" />
    <path d="M 124 158 Q 105 75 75 50 Q 108 98 125 160 Z" />
    <path d="M 125 160 Q 175 85 225 95 Q 170 115 128 165 Z" />
    <path d="M 126 164 Q 195 125 245 155 Q 185 150 126 172 Z" />
    <path d="M 122 168 Q 175 175 210 215 Q 162 190 120 174 Z" />
  </g>

  <!-- Main Glassmorphism Hero Card -->
  <rect x="65" y="48" width="730" height="324" rx="16" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5" />
  <!-- Top Neon Highlight Bar on Card -->
  <rect x="65" y="48" width="730" height="4" rx="2" fill="url(#neonAccent)" />

  <!-- Status Pill -->
  <rect x="100" y="78" width="235" height="28" rx="14" fill="#FF2D55" fill-opacity="0.18" stroke="#FF2D55" stroke-width="1.2" />
  <circle cx="118" cy="92" r="4.5" fill="#FF2D55" filter="url(#neonGlow)" />
  <text x="132" y="97" fill="#EB9998" font-family="'Roboto', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">VIZSGAREMEK PROJEKT · 2026</text>

  <!-- Main Title (Bebas Neue / Impact Condensed Style) -->
  <text x="100" y="168" fill="#FFFFFF" font-family="'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif" font-size="68" font-weight="900" letter-spacing="3">
    GTA <tspan fill="#FF2D55">VI</tspan> COMPANION
  </text>
  <text x="100" y="208" fill="#EB9998" font-family="'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif" font-size="26" font-weight="700" letter-spacing="4">
    INTERAKTÍV 2D/3D LEONIDA TÉRKÉP &amp; JÁRMŰADATBÁZIS
  </text>

  <!-- Subtitle Description -->
  <text x="100" y="246" fill="#FFFFFF" fill-opacity="0.85" font-family="'Roboto', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Vice City hangulatú, sötét üveghatású (glassmorphism) webes és mobilos segédalkalmazás
  </text>
  <text x="100" y="268" fill="#FFFFFF" fill-opacity="0.85" font-family="'Roboto', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    3D-ben kiemelkedő épületekkel, autókatalógussal és 100%-os végigjátszás-követővel.
  </text>

  <!-- Feature Pills & Authors Row -->
  <g transform="translate(100, 298)">
    <rect x="0" y="0" width="145" height="34" rx="8" fill="#FF2D55" />
    <text x="72.5" y="22" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">2D ➔ 3D TÉRKÉP</text>

    <rect x="158" y="0" width="160" height="34" rx="8" fill="#5D549C" fill-opacity="0.45" stroke="#A373D3" stroke-width="1" />
    <text x="238" y="22" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">JÁRMŰADATBÁZIS</text>

    <rect x="330" y="0" width="155" height="34" rx="8" fill="#5D549C" fill-opacity="0.45" stroke="#EB9998" stroke-width="1" />
    <text x="407.5" y="22" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">100% CHECKLIST</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
</svg>
