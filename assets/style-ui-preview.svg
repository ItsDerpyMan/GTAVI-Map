<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <!-- Vice City Sunset Background (Visible behind translucent panels) -->
    <linearGradient id="viceSunsetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#352B61" />
      <stop offset="32%" stop-color="#5D549C" />
      <stop offset="62%" stop-color="#7E3A63" />
      <stop offset="85%" stop-color="#A373D3" />
      <stop offset="100%" stop-color="#EB9998" />
    </linearGradient>

    <linearGradient id="extrudePink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#7E3A63" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="extrudePurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A373D3" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#5D549C" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="statBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#EB9998" />
    </linearGradient>
  </defs>

  <!-- Sunset Base Wallpaper -->
  <rect width="1200" height="620" rx="18" fill="url(#viceSunsetBg)" />
  <!-- Dark Overlay over wallpaper for readability -->
  <rect width="1200" height="620" rx="18" fill="#0F0F0F" fill-opacity="0.35" />

  <!-- Subtle Background Palm Silhouettes showing through the glass UI -->
  <g fill="#0F0F0F" opacity="0.38">
    <path d="M 1080 620 Q 1060 400 1020 220 L 1005 224 Q 1040 400 1052 620 Z" />
    <path d="M 1012 222 Q 1110 175 1175 215 Q 1100 205 1015 232 Z" />
    <path d="M 1010 220 Q 1090 130 1155 140 Q 1075 160 1012 225 Z" />
    <path d="M 1008 220 Q 940 135 880 155 Q 950 175 1006 226 Z" />
    <path d="M 1006 225 Q 920 185 865 225 Q 935 215 1006 232 Z" />
  </g>

  <!-- 1. TOP HEADER BAR (Translucent Dark Glass, Pink Active Menu) -->
  <rect x="28" y="22" width="1144" height="62" rx="14" fill="#0F0F0F" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" />
  <text x="56" y="61" fill="#FFFFFF" font-family="'Bebas Neue', 'Impact', sans-serif" font-size="28" font-weight="900" letter-spacing="2">
    LEONIDA <tspan fill="#FF2D55">VI</tspan> HUB
  </text>

  <!-- Nav Menu Items -->
  <g transform="translate(280, 35)">
    <!-- Active Item -->
    <rect x="0" y="0" width="145" height="36" rx="8" fill="#FF2D55" />
    <text x="72.5" y="23" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13" font-weight="700">3D TÉRKÉP</text>

    <text x="215" y="23" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85" font-family="'Roboto', sans-serif" font-size="13" font-weight="600">JÁRMŰADATBÁZIS</text>
    <text x="365" y="23" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85" font-family="'Roboto', sans-serif" font-size="13" font-weight="600">100% CHECKLIST</text>
    <text x="495" y="23" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85" font-family="'Roboto', sans-serif" font-size="13" font-weight="600">SAJÁT GARÁZS</text>
  </g>

  <!-- Search Box in Header -->
  <rect x="920" y="35" width="225" height="36" rx="8" fill="#0F0F0F" fill-opacity="0.7" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2" />
  <text x="940" y="58" fill="#EB9998" font-family="'Roboto', sans-serif" font-size="12">Keresés: Vice Beach, Banshee...</text>

  <!-- 2. LEFT PANEL: Translucent Map Filter Sidebar -->
  <rect x="28" y="102" width="250" height="492" rx="16" fill="#0F0F0F" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" />
  <text x="52" y="142" fill="#FFFFFF" font-family="'Bebas Neue', 'Impact', sans-serif" font-size="24" letter-spacing="1.5">TÉRKÉP SZŰRŐK</text>
  <text x="52" y="162" fill="#EB9998" font-family="'Roboto', sans-serif" font-size="12">Haladás: 68 / 120 megtalálva</text>

  <!-- Progress Bar -->
  <rect x="52" y="174" width="202" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.14" />
  <rect x="52" y="174" width="128" height="8" rx="4" fill="url(#statBar)" />

  <!-- Filter Toggles -->
  <g transform="translate(52, 204)">
    <rect x="0" y="0" width="202" height="42" rx="10" fill="#FF2D55" fill-opacity="0.2" stroke="#FF2D55" stroke-width="1.2" />
    <circle cx="22" cy="21" r="6" fill="#FF2D55" />
    <text x="40" y="26" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13" font-weight="700">3D Épület Kiemelés (ON)</text>

    <rect x="0" y="54" width="202" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="22" cy="74" r="6" fill="#EB9998" />
    <text x="40" y="79" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Menedékhelyek (14)</text>

    <rect x="0" y="106" width="202" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="22" cy="126" r="6" fill="#A373D3" />
    <text x="40" y="131" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Gyűjthető Tárgyak (100)</text>

    <rect x="0" y="158" width="202" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="22" cy="178" r="6" fill="#5D549C" />
    <text x="40" y="183" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Tuningműhelyek (18)</text>

    <rect x="0" y="210" width="202" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="22" cy="230" r="6" fill="#FF2D55" />
    <text x="40" y="235" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Ugratók &amp; Kihívások (35)</text>
  </g>

  <rect x="52" y="532" width="202" height="40" rx="10" fill="#FF2D55" />
  <text x="153" y="557" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13" font-weight="700">+ SAJÁT JELÖLŐ LEHELYEZÉSE</text>

  <!-- 3. CENTER PANEL: 2D -> 3D INTERACTIVE EXTRUDED MAP VIEWPORT -->
  <rect x="296" y="102" width="548" height="492" rx="16" fill="#0F0F0F" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5" />

  <!-- Map Canvas Water & Coastline -->
  <path d="M 297 103 L 843 103 L 843 593 L 660 593 Q 630 430 710 270 Q 755 180 695 103 Z" fill="#13192B" opacity="0.85" />
  <path d="M 660 593 Q 630 430 710 270 Q 755 180 695 103" fill="none" stroke="#A373D3" stroke-width="2" stroke-opacity="0.5" />

  <!-- Perspective Neon Streets on the 2D Base Map -->
  <g stroke-linecap="round">
    <line x1="315" y1="490" x2="795" y2="290" stroke="#FF2D55" stroke-width="4" stroke-opacity="0.85" />
    <line x1="335" y1="360" x2="725" y2="205" stroke="#5D549C" stroke-width="3" stroke-opacity="0.7" />
    <line x1="410" y1="570" x2="640" y2="140" stroke="#EB9998" stroke-width="2.5" stroke-opacity="0.65" />
    <line x1="320" y1="260" x2="670" y2="495" stroke="#6F70A2" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- 3D Extruded Buildings Rising from the Map (Zoom 15.8 / Pitch 55°) -->
  <g transform="translate(360, 170)">
    <!-- Building A (Selected Vice Beach Hotel) -->
    <polygon points="150,70 200,50 200,220 150,240" fill="url(#extrudePink)" stroke="#FF2D55" stroke-width="1.8" />
    <polygon points="200,50 245,70 245,240 200,220" fill="url(#extrudePurple)" stroke="#EB9998" stroke-width="1.5" />
    <polygon points="150,70 200,50 245,70 195,90" fill="#FF2D55" />

    <!-- Building B -->
    <polygon points="55,140 95,125 95,250 55,265" fill="url(#extrudePurple)" stroke="#A373D3" stroke-width="1.2" />
    <polygon points="95,125 130,140 130,265 95,250" fill="#1C1930" stroke="#5D549C" stroke-width="1.2" />
    <polygon points="55,140 95,125 130,140 90,155" fill="#A373D3" />

    <!-- Building C -->
    <polygon points="255,120 295,104 295,235 255,250" fill="url(#extrudePurple)" stroke="#EB9998" stroke-width="1.2" />
    <polygon points="295,104 330,120 330,250 295,235" fill="#1C1930" stroke="#7E3A63" stroke-width="1.2" />
    <polygon points="255,120 295,104 330,120 290,136" fill="#EB9998" />

    <!-- Active Blip & Popup above Building A -->
    <circle cx="198" cy="24" r="12" fill="#FF2D55" stroke="#FFFFFF" stroke-width="2.5" />
    <rect x="115" y="-26" width="166" height="36" rx="8" fill="#0F0F0F" fill-opacity="0.92" stroke="#FF2D55" stroke-width="1.5" />
    <text x="198" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="12" font-weight="700">OCEAN VIEW SAFEHOUSE</text>
  </g>

  <!-- Map HUD Overlay Badge (Zoom & Pitch Indicator) -->
  <rect x="316" y="122" width="245" height="36" rx="8" fill="#0F0F0F" fill-opacity="0.82" stroke="#A373D3" stroke-width="1.2" />
  <text x="332" y="145" fill="#EB9998" font-family="monospace" font-size="12" font-weight="700">ZOOM: 15.8x · PITCH: 55° (3D AKTÍV)</text>

  <!-- 4. RIGHT PANEL: Translucent Vehicle Database Card (Autókártya) -->
  <rect x="862" y="102" width="310" height="492" rx="16" fill="#0F0F0F" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" />
  <text x="886" y="142" fill="#FFFFFF" font-family="'Bebas Neue', 'Impact', sans-serif" font-size="24" letter-spacing="1.5">JÁRMŰ ADATLAP</text>

  <!-- Vehicle Preview Thumbnail Box -->
  <rect x="886" y="158" width="262" height="132" rx="12" fill="url(#viceSunsetBg)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" />
  <!-- Stylized Sports Car Silhouette -->
  <path d="M 915 248 L 938 222 L 995 218 L 1045 232 L 1118 236 L 1122 254 L 912 254 Z" fill="#0F0F0F" stroke="#FF2D55" stroke-width="2" />
  <circle cx="950" cy="254" r="14" fill="#0F0F0F" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="1085" cy="254" r="14" fill="#0F0F0F" stroke="#FFFFFF" stroke-width="3" />
  <rect x="898" y="170" width="76" height="22" rx="6" fill="#0F0F0F" fill-opacity="0.8" />
  <text x="936" y="185" text-anchor="middle" fill="#FF2D55" font-family="'Roboto', sans-serif" font-size="11" font-weight="700">SPORTS</text>

  <!-- Car Name & Price -->
  <text x="886" y="324" fill="#FFFFFF" font-family="'Bebas Neue', 'Impact', sans-serif" font-size="30" letter-spacing="1.5">BRAVADO BANSHEE VI</text>
  <text x="886" y="346" fill="#EB9998" font-family="'Roboto', sans-serif" font-size="14" font-weight="700">Ár: $185,000 · Lelőhely: Vice Beach</text>

  <!-- Performance Stat Bars -->
  <g transform="translate(886, 372)">
    <text x="0" y="14" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Végsebesség (342 km/h)</text>
    <rect x="0" y="22" width="262" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.14" />
    <rect x="0" y="22" width="236" height="8" rx="4" fill="url(#statBar)" />

    <text x="0" y="52" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Gyorsulás (0-100: 2.7s)</text>
    <rect x="0" y="60" width="262" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.14" />
    <rect x="0" y="60" width="220" height="8" rx="4" fill="url(#statBar)" />

    <text x="0" y="90" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Irányíthatóság</text>
    <rect x="0" y="98" width="262" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.14" />
    <rect x="0" y="98" width="205" height="8" rx="4" fill="#A373D3" />

    <text x="0" y="128" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="13">Fékezés</text>
    <rect x="0" y="136" width="262" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.14" />
    <rect x="0" y="136" width="185" height="8" rx="4" fill="#5D549C" />
  </g>

  <!-- Action Buttons on Vehicle Card -->
  <rect x="886" y="532" width="126" height="40" rx="10" fill="#FF2D55" />
  <text x="949" y="557" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="12" font-weight="700">+ GARÁZSBA</text>

  <rect x="1022" y="532" width="126" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" />
  <text x="1085" y="557" text-anchor="middle" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-size="12" font-weight="600">ÖSSZEHASONLÍT</text>

  <rect x="1" y="1" width="1198" height="618" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" />
</svg>
